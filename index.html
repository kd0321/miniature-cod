<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweet Roll Studios</title>

  <style>
    /* ========== RESET ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ========== BASE ========== */
    body {
      font-family: Arial, sans-serif;
      background: #0e3b2e; /* GREEN HOMEPAGE */
      color: #f5f5f5;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 100px 20px 60px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #1f5a46;
      color: #bfe9d5;
      font-size: 0.9rem;
    }

    /* ========== TITLE AREA ========== */
    .title-wrap {
      position: relative;
      display: inline-block;
      padding: 40px 60px;
    }

    .title-wrap img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 240px;
      width: auto;
      opacity: 0.6;
      z-index: 0;
      pointer-events: none;
    }

    .title-wrap h1 {
      position: relative;
      z-index: 1;
      font-size: 3.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.7),
        0 0 20px rgba(0, 0, 0, 0.4);
    }

    header p {
      margin-top: 16px;
      font-size: 1.1rem;
      color: #cde7db;
    }

    /* ========== SECTION + GRID ========== */
    .section-title {
      font-size: 1.6rem;
      margin-bottom: 22px;
      border-left: 4px solid #8dffb3;
      padding-left: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    /* ========== CARD ========== */
    .card {
      background: #102e24;
      border: 1px solid #1f5a46;
      border-radius: 16px;
      padding: 20px;
      min-height: 180px;

      /* keeps spacing consistent between book 1 + book 2 */
      display: flex;
      flex-direction: column;
    }

    .card h3 {
      font-size: 1.15rem;
      margin: 10px 0 8px;
    }

    .card p {
      font-size: 0.95rem;
      color: #bfe9d5;
      line-height: 1.4;
    }

    /* ========== BOOK COVER (SAME VIEW FOR BOTH) ========== */
    .book-cover {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      border: 1px solid #1f5a46;
      margin-bottom: 14px;

      /* identical cropping behavior for both covers */
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Zoomed-out view for second book only */
/* FORCE full image visibility — extreme zoom out */
.book-cover--full {
  object-fit: contain;      /* show entire image */
  object-position: center;
  background: #0e3b2e;

  /* this is the key */
  transform: scale(0.25);   /* 4x zoomed out */
  transform-origin: center;

  /* prevent layout break */
  width: 100%;
  height: 260px;
}


  </style>
</head>

<body>
  <header>
    <div class="title-wrap">
      <img src="images/chooru.png" alt="Sweet Roll Studios Emblem" />
      <h1>Sweet Roll Studios</h1>
    </div>
    <p>Original stories • Animation • Digital worlds</p>
  </header>

  <main>
    <h2 class="section-title">Features In Progress</h2>

    <div class="grid">
      <div class="card">
        <img src="images/core1.png" alt="Virtual Book Title 1 Cover" class="book-cover" />
        <h3>Core Protocol</h3>
        <p>Those who fail to control their core become liabilities, not legends.</p>
      </div>

      <div class="card">
        <img src="images/blackout1.png" alt="Virtual Book Title 2 Cover" class="book-cover" />
        <h3>Blackout States</h3>
        <p>Placeholder for your second illustrated story.</p>
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Sweet Roll Studios
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
