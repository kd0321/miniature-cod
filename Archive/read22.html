<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga List | Sweet Roll Studios</title>
  <style>
    /* ===== RESET ===== */
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", Helvetica, sans-serif; }
    a{ color:inherit; text-decoration:none; }
    img{ display:block; max-width:100%; }

    /* ===== THEME (close to Manga Plus: clean dark, minimal accents) ===== */
    :root{
      --bg:#0b0d10;
      --top:#15181c;
      --line:#2b3036;
      --text:#f3f4f6;
      --muted:#a8b0bb;
      --card:#101318;
      --shadow: 0 18px 45px rgba(0,0,0,.45);
      --radius: 14px;
      --accent:#ff3b3b;
    }

    body{
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== TOP HEADER ===== */
    .top{
      background: linear-gradient(#1a1d22, #13161a);
      border-bottom: 1px solid var(--line);
    }

    .top-inner{
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 16px 10px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
    }

    .title-wrap h1{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .2px;
      line-height: 1;
    }

    .crumbs{
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--muted);
      display:flex;
      gap: 8px;
      align-items:center;
      flex-wrap: wrap;
    }

    .crumbs a{ color: var(--muted); }
    .crumbs a:hover{ color: var(--text); }
    .crumbs .sep{ opacity:.75; }

    /* ===== MENU (kept from your site) ===== */
    .menu-container{ position: relative; }
    .menu-btn{
      background: rgba(255,255,255,.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .menu-btn:hover{ border-color: rgba(255,255,255,.18); }

    .menu-dropdown{
      position: absolute;
      right: 0;
      top: 46px;
      background: #12161c;
      border: 1px solid var(--line);
      border-radius: 14px;
      min-width: 220px;
      display:none;
      overflow:hidden;
      box-shadow: var(--shadow);
      z-index: 50;
    }

    .menu-dropdown a{
      display:block;
      padding: 12px 14px;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-weight: 700;
      letter-spacing: .3px;
    }
    .menu-dropdown a:hover{ background: rgba(255,255,255,.06); color: var(--text); }
    .menu-dropdown a:last-child{ border-bottom:none; }

    /* ===== TABS + CONTROLS BAR ===== */
    .bar{
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .bar-inner{
      border-top: 1px solid rgba(255,255,255,.06);
      padding: 14px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }

    .tabs{
      display:flex;
      gap: 26px;
      align-items:center;
      justify-content:center;
      flex: 1;
    }

    .tab{
      position: relative;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .3px;
      padding: 10px 2px;
      cursor:pointer;
      user-select:none;
    }

    .tab[aria-selected="true"]{
      color: var(--text);
    }

    .tab[aria-selected="true"]::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom: -6px;
      height: 2px;
      background: var(--text);
      border-radius: 999px;
    }

    .controls{
      display:flex;
      gap: 10px;
      align-items:center;
    }

    .select{
      background: rgba(255,255,255,.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 800;
      outline: none;
    }

    /* ===== GRID ===== */
    main{
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 16px 60px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 22px 18px;
    }

    @media (max-width: 1100px){
      .grid{ grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    @media (max-width: 850px){
      .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 520px){
      .top-inner{ align-items:flex-start; }
      .tabs{ gap: 16px; }
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .card{ min-width: 0; }

    .cover{
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 10px;
      background:
        radial-gradient(120px 140px at 30% 30%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(135deg, rgba(255,59,59,.22), rgba(0,0,0,.2));
      border: 1px solid rgba(255,255,255,.10);
      overflow:hidden;
      box-shadow: 0 16px 30px rgba(0,0,0,.35);
      display:grid;
      place-items:center;
      color: rgba(243,244,246,.85);
      font-weight: 900;
      letter-spacing: .4px;
      text-align:center;
      padding: 10px;
    }

    .cover img{
      width:100%;
      height:100%;
      object-fit: cover;
    }

    .meta{
      padding-top: 10px;
      display:flex;
      flex-direction:column;
      gap: 3px;
    }

    .name{
      font-size: 13.5px;
      font-weight: 900;
      line-height: 1.2;
      color: var(--text);
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }

    .author{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.2;
      display:-webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }

    .langs{
      margin-top: 6px;
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lang{
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .3px;
      padding: 4px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: rgba(243,244,246,.88);
    }

    .empty{
      padding: 26px 8px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .2px;
    }

    /* Hover like MangaPlus (subtle lift) */
    .card a:hover .cover{
      transform: translateY(-2px);
      transition: transform .12s ease;
      border-color: rgba(255,255,255,.18);
    }

    /* Accessibility focus */
    .card a:focus-visible, .tab:focus-visible, .menu-btn:focus-visible, .select:focus-visible{
      outline: 2px solid rgba(255,59,59,.75);
      outline-offset: 2px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="top">
    <div class="top-inner">
      <div class="title-wrap">
        <h1>Manga List</h1>
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="#" id="crumbHome">home</a>
          <span class="sep">›</span>
          <span id="crumbSection">ongoing</span>
        </nav>
      </div>

      <div class="menu-container">
        <button class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">MENU</button>
        <div class="menu-dropdown" id="menuDropdown" role="menu" aria-label="Menu">
          <!-- Update these paths to match your site folders -->
          <a href="../index.html" role="menuitem">Home</a>
          <a href="read.html" role="menuitem">Read</a>
          <a href="../clips/index.html" role="menuitem">Clips</a>
          <a href="../shop/index.html" role="menuitem">Shop</a>
          <a href="../contact/index.html" role="menuitem">Contact</a>
        </div>
      </div>
    </div>

    <div class="bar">
      <div class="bar-inner">
        <div style="width:220px;"></div>

        <div class="tabs" role="tablist" aria-label="Manga list sections">
          <div class="tab" role="tab" tabindex="0" aria-selected="true" data-tab="ongoing">Ongoing</div>
          <div class="tab" role="tab" tabindex="0" aria-selected="false" data-tab="completed">Completed</div>
          <div class="tab" role="tab" tabindex="0" aria-selected="false" data-tab="oneshot">One-shot</div>
        </div>

        <div class="controls">
          <select class="select" id="sortSelect" aria-label="Sort">
            <option value="az">A to Z</option>
            <option value="za">Z to A</option>
            <option value="recent" selected>Most Recent</option>
          </select>
          <select class="select" id="filterSelect" aria-label="Filter">
            <option value="all" selected>Filter</option>
            <option value="core">Core Protocol</option>
            <option value="blackout">Black Out States</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No titles in this section yet.</div>
  </main>

  <script>
    // ===== MENU TOGGLE =====
    const menuBtn = document.getElementById('menuBtn');
    const menuDropdown = document.getElementById('menuDropdown');

    function closeMenu(){
      menuDropdown.style.display = 'none';
      menuBtn.setAttribute('aria-expanded','false');
    }

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuDropdown.style.display === 'block';
      if (isOpen) closeMenu();
      else {
        menuDropdown.style.display = 'block';
        menuBtn.setAttribute('aria-expanded','true');
      }
    });

    document.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeMenu(); });

    // ===== DATA (replace/add your real items) =====
    // cover: set to "images/yourcover.png" when ready. If blank, shows placeholder.
    const DATA = {
      ongoing: [
        { id:'cp1', series:'core', title:'Core Protocol — Vol. 1', author:'K. Darbeau', langs:['EN'], cover:'' , updated:'2026-01-03', href:'#' },
        { id:'cp2', series:'core', title:'Core Protocol — Vol. 2', author:'K. Darbeau', langs:['EN'], cover:'' , updated:'2026-01-02', href:'#' },
        { id:'cp3', series:'core', title:'Core Protocol — Vol. 3', author:'K. Darbeau', langs:['EN'], cover:'' , updated:'2026-01-01', href:'#' },
        { id:'cp4', series:'core', title:'Core Protocol — Vol. 4', author:'K. Darbeau', langs:['EN'], cover:'' , updated:'2025-12-20', href:'#' },
        { id:'cp5', series:'core', title:'Core Protocol — Vol. 5', author:'K. Darbeau', langs:['EN'], cover:'' , updated:'2025-12-10', href:'#' },
        { id:'bos1', series:'blackout', title:'Black Out States — Vol. 1', author:'K. Darbeau', langs:['EN'], cover:'' , updated:'2026-01-03', href:'#' },
      ],
      completed: [],
      oneshot: []
    };

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const crumbSection = document.getElementById('crumbSection');
    const sortSelect = document.getElementById('sortSelect');
    const filterSelect = document.getElementById('filterSelect');

    let activeTab = 'ongoing';

    function sortItems(items){
      const mode = sortSelect.value;
      const list = [...items];

      if(mode === 'recent'){
        list.sort((a,b)=> (b.updated||'').localeCompare(a.updated||''));
      } else if(mode === 'az'){
        list.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
      } else if(mode === 'za'){
        list.sort((a,b)=> (b.title||'').localeCompare(a.title||''));
      }
      return list;
    }

    function filterItems(items){
      const f = filterSelect.value;
      if(f === 'all') return items;
      return items.filter(x => x.series === f);
    }

    function render(){
      crumbSection.textContent = activeTab === 'oneshot' ? 'one-shot' : activeTab;

      let items = DATA[activeTab] || [];
      items = filterItems(items);
      items = sortItems(items);

      grid.innerHTML = '';

      if(!items.length){
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      const frag = document.createDocumentFragment();
      for(const it of items){
        const card = document.createElement('div');
        card.className = 'card';

        const a = document.createElement('a');
        a.href = it.href || '#';
        a.setAttribute('aria-label', it.title);

        const cover = document.createElement('div');
        cover.className = 'cover';

        if(it.cover){
          const img = document.createElement('img');
          img.src = it.cover;
          img.alt = it.title;
          cover.appendChild(img);
        } else {
          cover.textContent = it.title;
        }

        const meta = document.createElement('div');
        meta.className = 'meta';

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = it.title;

        const author = document.createElement('div');
        author.className = 'author';
        author.textContent = it.author || '';

        const langs = document.createElement('div');
        langs.className = 'langs';
        (it.langs || []).forEach(l => {
          const span = document.createElement('span');
          span.className = 'lang';
          span.textContent = l;
          langs.appendChild(span);
        });

        meta.appendChild(name);
        meta.appendChild(author);
        if((it.langs||[]).length) meta.appendChild(langs);

        a.appendChild(cover);
        a.appendChild(meta);
        card.appendChild(a);
        frag.appendChild(card);
      }

      grid.appendChild(frag);
    }

    // Tabs
    const tabs = document.querySelectorAll('.tab');
    function setTab(next){
      activeTab = next;
      tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === next ? 'true' : 'false'));
      render();
    }

    tabs.forEach(t => {
      t.addEventListener('click', ()=> setTab(t.dataset.tab));
      t.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          setTab(t.dataset.tab);
        }
      });
    });

    sortSelect.addEventListener('change', render);
    filterSelect.addEventListener('change', render);

    // Initial
    render();
  </script>
</body>
</html>
