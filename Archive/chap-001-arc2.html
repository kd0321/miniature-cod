<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blackout States — Chapter 01</title>

  <style>
    :root{
      --bg:#0b0b0f;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.14);
      --muted:rgba(255,255,255,.72);
      --accent:#8dffb3;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      min-height:100vh;
    }

    .topbar{
      max-width:1100px;
      margin:0 auto;
      padding:14px 16px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .topbar a{
      color:#fff;
      text-decoration:none;
      opacity:.9;
    }
    .topbar a:hover{opacity:1}

    .title{
      max-width:1100px;
      margin:0 auto;
      padding:8px 16px 10px;
    }
    .title h1{
      margin:0;
      font-size:18px;
      letter-spacing:.6px;
    }
    .title p{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
    }

    .reader{
      max-width:1100px;
      margin:0 auto;
      padding:10px 16px 20px;
    }

    .frame{
      position:relative;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(0,0,0,.45);
    }

    /* image area */
    .stage{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#07070a;
      min-height:60vh;
      user-select:none;
      touch-action:pan-y; /* allow vertical scroll but we handle horizontal swipe */
    }

    .page-img{
      width:100%;
      height:auto;
      display:block;
      max-height:84vh;
      object-fit:contain;
      background:#07070a;
    }

    /* tap zones */
    .zone{
      position:absolute;
      top:0;
      bottom:0;
      width:35%;
      cursor:pointer;
      z-index:5;
    }
    .zone.left{left:0}
    .zone.right{right:0}
    .zone:active{background:rgba(255,255,255,.03)}

    /* arrows */
    .arrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:46px;
      height:46px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:6;
      opacity:.95;
      backdrop-filter: blur(6px);
    }
    .arrow.left{left:12px}
    .arrow.right{right:12px}
    .arrow span{
      font-size:24px;
      line-height:1;
      opacity:.9;
    }

    .bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-top:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
    }

    .meta{
      font-size:13px;
      color:var(--muted);
    }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
    }

    button{
      appearance:none;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;
      padding:9px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
      letter-spacing:.3px;
    }
    button:hover{border-color:rgba(255,255,255,.28)}
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .hint{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px 24px;
      color:var(--muted);
      font-size:12px;
      opacity:.9;
    }

    .dot{
      color:var(--accent);
      font-weight:700;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <!-- Change this if you have a specific Blackout States chapter list page -->
    <a href="../series-home.html">← Series Home</a>

    <a href="../../index.html">SweetRollStudios.com</a>
  </div>

  <div class="title">
    <h1>Blackout States — Chapter 01</h1>
    <p>Tap left/right (or swipe). Desktop: use ← → keys.</p>
  </div>

  <div class="reader">
    <div class="frame">
      <div class="stage" id="stage" aria-label="Page viewer">
        <div class="zone left" id="tapPrev" aria-label="Previous page"></div>
        <div class="zone right" id="tapNext" aria-label="Next page"></div>

        <div class="arrow left" id="btnPrev" title="Previous (←)"><span>‹</span></div>
        <div class="arrow right" id="btnNext" title="Next (→)"><span>›</span></div>

        <img id="pageImg" class="page-img" src="" alt="Chapter page">
      </div>

      <div class="bottom">
        <div class="meta" id="metaText">Loading…</div>

        <div class="controls">
          <button id="firstBtn" type="button">First</button>
          <button id="prevBtn" type="button">Prev</button>
          <button id="nextBtn" type="button">Next</button>
          <button id="lastBtn" type="button">Last</button>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">
    Tip: you can link directly to a page with <span class="dot">?p=5</span> (example: chap-01.html?p=5)
  </div>

<script>
(() => {
  // ======= CONFIG =======
  const BASE = "chapter-001/images/";
  const EXT  = "webp";

  // Set total pages here:
  const TOTAL_PAGES = 3; // <-- change to 10, 20, etc when you add pages

  // ======= STATE =======
  const imgEl = document.getElementById("pageImg");
  const meta  = document.getElementById("metaText");

  const firstBtn = document.getElementById("firstBtn");
  const prevBtn  = document.getElementById("prevBtn");
  const nextBtn  = document.getElementById("nextBtn");
  const lastBtn  = document.getElementById("lastBtn");

  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const tapPrev = document.getElementById("tapPrev");
  const tapNext = document.getElementById("tapNext");
  const stage   = document.getElementById("stage");

  const pad3 = (n) => String(n).padStart(3, "0");
  const pageSrc = (n) => `${BASE}${pad3(n)}.${EXT}`;

  let page = 1;

  // ======= URL PARAM (optional) =======
  const params = new URLSearchParams(location.search);
  const p = parseInt(params.get("p"), 10);
  if (!Number.isNaN(p) && p >= 1 && p <= TOTAL_PAGES) page = p;

  function setUrlPage(n){
    const u = new URL(location.href);
    u.searchParams.set("p", n);
    history.replaceState({}, "", u);
  }

  // ======= PRELOAD =======
  function preload(n){
    if (n < 1 || n > TOTAL_PAGES) return;
    const i = new Image();
    i.src = pageSrc(n);
  }

  // ======= RENDER =======
  function render(){
    imgEl.src = pageSrc(page);
    imgEl.alt = `Chapter 01 — Page ${pad3(page)}`;

    meta.textContent = `Page ${pad3(page)} / ${pad3(TOTAL_PAGES)}`;

    prevBtn.disabled  = page === 1;
    firstBtn.disabled = page === 1;
    nextBtn.disabled  = page === TOTAL_PAGES;
    lastBtn.disabled  = page === TOTAL_PAGES;

    // preload next/prev
    preload(page + 1);
    preload(page - 1);

    setUrlPage(page);
  }

  function go(n){
    page = Math.min(TOTAL_PAGES, Math.max(1, n));
    render();
  }
  function next(){ if (page < TOTAL_PAGES) go(page + 1); }
  function prev(){ if (page > 1) go(page - 1); }

  // ======= EVENTS =======
  firstBtn.addEventListener("click", () => go(1));
  lastBtn.addEventListener("click", () => go(TOTAL_PAGES));
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);

  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);

  tapPrev.addEventListener("click", prev);
  tapNext.addEventListener("click", next);

  // keyboard
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  // swipe (mobile)
  let x0 = null;
  stage.addEventListener("touchstart", (e) => {
    x0 = e.touches[0].clientX;
  }, {passive:true});

  stage.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const x1 = e.changedTouches[0].clientX;
    const dx = x1 - x0;
    x0 = null;

    // small threshold so accidental touches don’t flip
    if (Math.abs(dx) < 40) return;

    if (dx < 0) next(); // swipe left -> next
    else prev();        // swipe right -> prev
  }, {passive:true});

  // handle missing images gracefully
  imgEl.addEventListener("error", () => {
    meta.textContent = `Missing file: ${pageSrc(page)}`;
  });

  // init
  render();
})();
</script>

</body>
</html>
