<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sweet Roll Studios</title>

  <style>
    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }

    /* ===== BASE (MATCH WATCH) ===== */
    body {
      font-family: Arial, sans-serif;
      background: #0e3b2e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 90px 20px 40px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 70px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #1f5a46;
      color: #bfe9d5;
      font-size: 0.9rem;
    }

    /* ===== TITLE (MATCH WATCH) ===== */
    .title-wrap {
      position: relative;
      display: inline-block;
      padding: 28px 44px;
    }

    .title-wrap img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 200px;
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }

    .title-wrap h1 {
      position: relative;
      z-index: 1;
      font-size: 2.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 3px 10px rgba(0,0,0,0.7),
        0 0 20px rgba(0,0,0,0.4);
    }

    header p {
      margin-top: 12px;
      font-size: 1.05rem;
      color: #cde7db;
    }

    /* ===== LOGIN PANEL (WATCH CARD STYLE) ===== */
    .auth-wrap{
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #102e24;
      border: 1px solid #1f5a46;
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .card h2{
      font-size: 1.4rem;
      border-left: 4px solid #8dffb3;
      padding-left: 12px;
      margin-bottom: 6px;
    }

    .muted {
      color: #bfe9d5;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap: 6px;
      margin-top: 4px;
    }

    label{
      font-size: 0.9rem;
      color: #bfe9d5;
      letter-spacing: 0.3px;
    }

    input{
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid #1f5a46;
      background: rgba(0,0,0,0.25);
      color: #f5f5f5;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus{
      border-color: #8dffb3;
      box-shadow: 0 0 0 3px rgba(141,255,179,0.15);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .check{
      display:flex;
      align-items:center;
      gap: 8px;
      color: #bfe9d5;
      font-size: 0.92rem;
    }

    .check input{
      width: auto;
      accent-color: #8dffb3;
    }

    .link{
      color: #cde7db;
      font-size: 0.92rem;
    }
    .link:hover{ color:#ffffff; text-decoration: underline; }

    /* ===== BUTTON (MATCH WATCH) ===== */
    .btn {
      display: inline-block;
      margin-top: 8px;
      background: #144235;
      border: 1px solid #1f5a46;
      color: #f5f5f5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn:hover { background: #1f5a46; }

    .btn.secondary{
      background: transparent;
    }
    .btn.secondary:hover{
      background: rgba(31,90,70,0.35);
    }

    /* ===== TOP LEFT LARGE MENU (MATCH WATCH) ===== */
    .menu-container {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 999;
    }

    .menu-btn {
      background: #102e24;
      color: #f5f5f5;
      border: 1px solid #1f5a46;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .menu-btn:hover { background: #144235; }

    .menu-dropdown {
      position: absolute;
      top: 60px;
      left: 0;
      background: #102e24;
      border: 1px solid #1f5a46;
      border-radius: 16px;
      min-width: 230px;
      display: none;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .menu-dropdown a {
      display: block;
      padding: 14px 20px;
      color: #bfe9d5;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .menu-dropdown a:hover {
      background: #1f5a46;
      color: #ffffff;
    }

    /* Small screens */
    @media (max-width: 520px) {
      header { padding-top: 110px; }
      .menu-btn { padding: 12px 18px; font-size: 1rem; }
      .title-wrap h1 { font-size: 2.2rem; }
      .card{ padding: 18px; }
    }
  </style>
</head>

<body>
  <!-- ===== MENU (TOP LEFT) ===== -->
  <div class="menu-container">
    <button class="menu-btn" type="button">MENU</button>

    <div class="menu-dropdown">
      <a href="/index.html">Home</a>
      <a href="clips.html">Clips</a>
      <a href="read.html">Read</a>
      <a href="watch.html">Watch</a>
      <a href="merch.html">Merch</a>
      <a href="socials.html">Socials</a>
      <a href="favorites.html">Favorites</a>
      <a href="community.html">Community</a>
      <a href="signup.html">Signup</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <header>
    <div class="title-wrap">
      <img src="/images/chooru.png" alt="Sweet Roll Studios Emblem">
      <h1>Login</h1>
    </div>
    <p>Welcome back • sign in to continue</p>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="card">
        <h2>Sign In</h2>
        <p class="muted">Use your email and password to access your account.</p>

        <form action="#" method="post">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" name="remember" />
              Remember me
            </label>
            <a class="link" href="forgot.html">Forgot password?</a>
          </div>

          <button class="btn" type="submit">Login</button>
          <a class="btn secondary" href="signup.html">Create Account</a>
        </form>
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Sweet Roll Studios
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Year
      const yearEl = document.getElementById("year");
      const currentYear = new Date().getFullYear();
      yearEl.textContent = currentYear;
    });

    </script>
