<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup | Sweet Roll Studios</title>

<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ===== BASE (MATCH WATCH) ===== */
body{
  font-family:Arial,sans-serif;
  background:#0e3b2e;
  color:#f5f5f5;
  min-height:100vh;
}

/* ===== HEADER ===== */
header{
  text-align:center;
  padding:90px 20px 40px;
}
.title-wrap{
  position:relative;
  display:inline-block;
  padding:28px 44px;
}
.title-wrap img{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  height:200px;
  opacity:.55;
  pointer-events:none;
}
.title-wrap h1{
  position:relative;
  z-index:1;
  font-size:2.7rem;
  letter-spacing:3px;
  text-transform:uppercase;
  text-shadow:0 3px 10px rgba(0,0,0,.7),0 0 20px rgba(0,0,0,.4);
}
header p{margin-top:12px;color:#cde7db;}

/* ===== PANEL ===== */
.panel{
  max-width:480px;
  margin:0 auto;
  background:#102e24;
  border:1px solid #1f5a46;
  border-radius:16px;
  padding:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

/* ===== FORM ===== */
label{
  display:block;
  font-size:.9rem;
  color:#bfe9d5;
  margin:12px 0 6px;
}
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #1f5a46;
  background:rgba(0,0,0,.3);
  color:#fff;
  font-size:.95rem;
}
input:focus{
  outline:none;
  border-color:#8dffb3;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:18px;
  width:100%;
  background:#144235;
  border:1px solid #1f5a46;
  color:#fff;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
}
.btn:hover{background:#1f5a46;}

/* ===== MENU (FROM WATCH) ===== */
.menu-container{
  position:fixed;
  top:24px; left:24px;
  z-index:999;
}
.menu-btn{
  background:#102e24;
  color:#f5f5f5;
  border:1px solid #1f5a46;
  border-radius:14px;
  padding:14px 28px;
  font-size:1.05rem;
  font-weight:bold;
  letter-spacing:2px;
}
.menu-dropdown{
  position:absolute;
  top:60px; left:0;
  background:#102e24;
  border:1px solid #1f5a46;
  border-radius:16px;
  min-width:230px;
  display:none;
  overflow:hidden;
}
.menu-dropdown a{
  display:block;
  padding:14px 20px;
  color:#bfe9d5;
  text-decoration:none;
}
.menu-dropdown a:hover{background:#1f5a46;color:#fff;}
</style>
</head>

<body>

<!-- MENU -->
<div class="menu-container">
  <button class="menu-btn">MENU</button>
  <div class="menu-dropdown">
    <a href="/index.html">Home</a>
    <a href="clips.html">Clips</a>
    <a href="read.html">Read</a>
    <a href="watch.html">Watch</a>
    <a href="merch.html">Merch</a>
    <a href="community.html">Community</a>
    <a href="login.html">Login</a>
  </div>
</div>

<header>
  <div class="title-wrap">
    <img src="/images/chooru.png">
    <h1>Signup</h1>
  </div>
  <p>Create your Sweet Roll Studios account</p>
</header>

<main>
  <div class="panel">
    <form>
      <label>Username</label>
      <input type="text">

      <label>Email</label>
      <input type="email">

      <label>Password</label>
      <input type="password">

      <button class="btn">Create Account</button>
    </form>
  </div>
</main>

<script>
const btn=document.querySelector(".menu-btn");
const drop=document.querySelector(".menu-dropdown");
btn.onclick=e=>{e.stopPropagation();drop.style.display=drop.style.display==="block"?"none":"block";}
document.onclick=e=>{if(!e.target.closest(".menu-container"))drop.style.display="none";}
</script>

</body>
</html>
