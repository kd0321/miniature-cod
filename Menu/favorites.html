<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites | Sweet Roll Studios</title>

  <style>
    /* ===== RESET ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== BASE (MATCHES HOMEPAGE) ===== */
    body {
      font-family: Arial, sans-serif;
      background: #0e3b2e; /* <<< FIX: matches your brand green */
      color: #f5f5f5;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 100px 20px 60px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #1f5a46;
      color: #bfe9d5;
      font-size: 0.9rem;
    }

    /* ===== TITLE (LOGO IN TOP MIDDLE) ===== */
    .title-wrap {
      position: relative;
      display: inline-block;
      padding: 40px 60px;
    }

    .title-wrap img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 240px;
      opacity: 0.6;
      z-index: 0;
      pointer-events: none;
    }

    .title-wrap h1 {
      position: relative;
      z-index: 1;
      font-size: 3.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 3px 10px rgba(0,0,0,0.7),
        0 0 20px rgba(0,0,0,0.4);
    }

    header p {
      margin-top: 16px;
      font-size: 1.1rem;
      color: #cde7db;
    }

    /* ===== SECTION TITLE ===== */
    .section-title {
      font-size: 1.6rem;
      margin-bottom: 22px;
      border-left: 4px solid #8dffb3;
      padding-left: 12px;
    }

    /* ===== EMPTY STATE (ON BRAND) ===== */
    .empty-wrap {
      background: #102e24;
      border: 1px solid #1f5a46;
      border-radius: 16px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }

    .empty-title {
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .empty-desc {
      color: #bfe9d5;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(141,255,179,0.65);
      border-radius: 12px;
      background: rgba(31, 90, 70, 0.25);
      color: #f5f5f5;
      font-weight: bold;
      letter-spacing: 0.6px;
    }

    /* ===== TOP LEFT MENU (MATCHES HOMEPAGE) ===== */
    .menu-container {
      position: fixed;
      top: 28px;
      left: 28px;
      z-index: 999;
    }

    .menu-btn {
      background: #102e24;
      color: #f5f5f5;
      border: 1px solid #1f5a46;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .menu-btn:hover {
      background: #144235;
    }

    .menu-dropdown {
      position: absolute;
      top: 60px;
      left: 0;
      background: #102e24;
      border: 1px solid #1f5a46;
      border-radius: 16px;
      min-width: 220px;
      display: none;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .menu-dropdown a {
      display: block;
      padding: 14px 20px;
      color: #bfe9d5;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .menu-dropdown a:hover {
      background: #1f5a46;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <!-- ===== MENU (FIX: ADD BACK MENU) ===== -->
  <div class="menu-container">
    <button class="menu-btn">MENU</button>

    <div class="menu-dropdown">
      <a href="clips.html">Clips</a>
      <a href="read.html">Read</a>
      <a href="episodes.html">Episodes</a>
      <a href="merch.html">Merch</a>
      <a href="socials.html">Socials</a>
      <a href="favorites.html">Favorites</a>
      <a href="community.html">Community</a>
      <a href="signup.html">Signup</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <!-- ===== HEADER (FIX: LOGO TOP MIDDLE) ===== -->
  <header>
    <div class="title-wrap">
      <img src="../images/chooru.png" alt="Sweet Roll Studios Emblem">
      <h1>Sweet Roll Studios</h1>
    </div>
    <p>Original stories • Animation • Digital worlds</p>
  </header>

  <main>
    <h2 class="section-title">Favorites</h2>

    <!-- Empty state (until you wire favorites storage) -->
    <div class="empty-wrap">
      <div class="empty-title">No favorites to show</div>
      <div class="empty-desc">
        Hit the <span class="pill">＋ Add to Favorite</span> button on any series to save it here.
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Sweet Roll Studios
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // footer year
      const yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // menu toggle
      const menuBtn = document.querySelector(".menu-btn");
      const menuDropdown = document.querySelector(".menu-dropdown");

      if (!menuBtn || !menuDropdown) return;

      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        menuDropdown.style.display =
          (menuDropdown.style.display === "block") ? "none" : "block";
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu-container")) {
          menuDropdown.style.display = "none";
        }
      });
    });
  </script>

</body>
</html>
