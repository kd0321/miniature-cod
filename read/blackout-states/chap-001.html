<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blackout States — Chapter 1</title>

  <style>
    body{margin:0;background:#0b0b0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 22px}
    a{color:#fff;text-decoration:none;opacity:.9}
    a:hover{opacity:1}
    h1{margin:10px 0 6px;font-size:18px}
    p{margin:0 0 12px;color:rgba(255,255,255,.75);font-size:13px}

    .frame{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(0,0,0,.45);
    }

    .stage{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#07070a;
      min-height:60vh;
      user-select:none;
      touch-action:pan-y;
    }

    img{
      width:100%;
      height:auto;
      max-height:85vh;
      object-fit:contain;
      display:block;
      background:#07070a;
    }

    .zone{
      position:absolute;top:0;bottom:0;width:35%;
      z-index:5;cursor:pointer;
    }
    .zone.left{left:0}
    .zone.right{right:0}

    .arrow{
      position:absolute;top:50%;transform:translateY(-50%);
      width:46px;height:46px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.28);
      display:flex;align-items:center;justify-content:center;
      z-index:6;backdrop-filter:blur(6px);
    }
    .arrow.left{left:12px}
    .arrow.right{right:12px}
    .arrow span{font-size:24px;opacity:.9}

    .bottom{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:10px 12px;border-top:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
    }
    .meta{font-size:13px;color:rgba(255,255,255,.72)}
    button{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;
      padding:9px 12px;border-radius:12px;
      cursor:pointer;font-weight:600;
    }
    button:disabled{opacity:.45;cursor:not-allowed}
  </style>
</head>

<body>
  <div class="wrap">
    <a href="/read.html">← Read</a>
    <h1>Blackout States — Chapter 1</h1>
    <p>Tap left/right (or swipe). Desktop: ← → keys.</p>

    <div class="frame">
      <div class="stage" id="stage">
        <div class="zone left" id="tapPrev"></div>
        <div class="zone right" id="tapNext"></div>

        <div class="arrow left" id="btnPrev"><span>‹</span></div>
        <div class="arrow right" id="btnNext"><span>›</span></div>

        <img id="pageImg" src="" alt="Chapter page">
      </div>

      <div class="bottom">
        <div class="meta" id="metaText">Loading…</div>
        <div>
          <button id="firstBtn" type="button">First</button>
          <button id="prevBtn" type="button">Prev</button>
          <button id="nextBtn" type="button">Next</button>
          <button id="lastBtn" type="button">Last</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ✅ ABSOLUTE PATHS (because /chapter-images is a top-level folder)
  const PAGES = [
    "/chapter-images/blackout-states/chapter-1/1.png",
    "/chapter-images/blackout-states/chapter-1/2.png",
    "/chapter-images/blackout-states/chapter-1/3.png",
    "/chapter-images/blackout-states/chapter-1/4.png",
    "/chapter-images/blackout-states/chapter-1/5.png",
    "/chapter-images/blackout-states/chapter-1/6.png",
    "/chapter-images/blackout-states/chapter-1/7.png",
    "/chapter-images/blackout-states/chapter-1/8.png",
    "/chapter-images/blackout-states/chapter-1/9.png"
  ];

  const imgEl = document.getElementById("pageImg");
  const meta = document.getElementById("metaText");

  const firstBtn = document.getElementById("firstBtn");
  const prevBtn  = document.getElementById("prevBtn");
  const nextBtn  = document.getElementById("nextBtn");
  const lastBtn  = document.getElementById("lastBtn");

  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const tapPrev = document.getElementById("tapPrev");
  const tapNext = document.getElementById("tapNext");
  const stage   = document.getElementById("stage");

  let index = 0;

  function preload(i){
    if (i < 0 || i >= PAGES.length) return;
    const im = new Image();
    im.src = PAGES[i];
  }

  function render(){
    imgEl.src = PAGES[index];
    meta.textContent = `Page ${index + 1} / ${PAGES.length}`;

    firstBtn.disabled = index === 0;
    prevBtn.disabled  = index === 0;
    nextBtn.disabled  = index === PAGES.length - 1;
    lastBtn.disabled  = index === PAGES.length - 1;

    preload(index + 1);
    preload(index - 1);
  }

  function go(i){
    index = Math.max(0, Math.min(PAGES.length - 1, i));
    render();
  }
  function next(){ if (index < PAGES.length - 1) go(index + 1); }
  function prev(){ if (index > 0) go(index - 1); }

  firstBtn.addEventListener("click", () => go(0));
  lastBtn.addEventListener("click", () => go(PAGES.length - 1));
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);

  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);
  tapPrev.addEventListener("click", prev);
  tapNext.addEventListener("click", next);

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  // swipe
  let x0 = null;
  stage.addEventListener("touchstart", (e)=>{ x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener("touchend", (e)=>{
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0) next(); else prev();
  }, {passive:true});

  imgEl.addEventListener("error", () => {
    meta.textContent = `Missing file: ${PAGES[index]}`;
  });

  render();
})();
</script>

</body>
</html>
